name: Endurecimento final de seguranca

on:
  push:
    branches: [feat/revisao-seguranca-final]
    paths:
      - '.github/workflows/security-hardening-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar endurecimento final
        run: python scripts/security-hardening-final.py

      - name: Conferir diff
        run: git diff --check

      - name: Commitar alteracoes
        run: |
          git config user.name "Cegonha Security Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "security: reforcar integridade de identidades e registros"
          git push origin HEAD:feat/revisao-seguranca-final
