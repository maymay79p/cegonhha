name: Validar Cegonha

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/revisao-completa-cegonha]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Instalar dependências do app
        run: npm install --no-audit --no-fund

      - name: Conferir versões esperadas pelo Expo
        run: npx expo install --check

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Executar Expo Doctor
        run: npx expo-doctor@latest

      - name: Validar bundle do Expo Go
        run: npm run check:expo-go

      - name: Validar prebuild Android dos recursos nativos opcionais
        run: npx expo prebuild --platform android --clean --no-install

      - name: Instalar dependências das Functions
        run: npm install --prefix functions --no-audit --no-fund

      - name: Testar push notifications
        run: npm test --prefix functions
