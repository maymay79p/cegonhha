name: Sincronizar lockfile da finalizacao

on:
  push:
    branches: [chore/finalizacao-tcc]
    paths:
      - package.json
      - .github/workflows/sync-lock-finalizacao.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/finalizacao-tcc
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Atualizar package-lock sem executar scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commitar lockfile se necessario
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile ja esta sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sincronizar package-lock da finalizacao"
          git push origin HEAD:chore/finalizacao-tcc
