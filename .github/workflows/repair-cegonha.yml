name: Aplicar revisao completa do Cegonha

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-cegonha.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correcoes revisadas
        run: python scripts/repair-cegonha.py

      - name: Conferir diff
        run: git diff --check

      - name: Salvar correcoes no GitHub
        run: |
          git config user.name "Cegonha Review Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: reforcar vinculos, mural e seguranca"
          git push origin HEAD:main
